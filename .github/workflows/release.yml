name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/ISSUE_TEMPLATE/bug_report.md"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "docker-compose.yml"
      - "README.md"
      - "SECURITY.md"
      - "security/suppressions.json"
      - "pyproject.toml"
      - "uv.lock"
      - "itambox/itambox/release.py"
      - "scripts/check_registry_image.py"
      - "scripts/release_policy.py"
      - "scripts/release_sbom.py"
      - "scripts/security_gate.py"
      - "scripts/install_security_tools.sh"
      - "scripts/tests/test_check_registry_image.py"
      - "scripts/tests/test_release_policy.py"
      - "scripts/tests/test_release_sbom.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted SemVer release identity (for example 1.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ITAMBOX_SOURCE: https://github.com/${{ github.repository }}

jobs:
  rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          python -m unittest scripts.tests.test_check_registry_image scripts.tests.test_release_policy scripts.tests.test_release_sbom
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_policy.py verify --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release image without publishing
        env:
          ITAMBOX_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Compile both release platforms into the builder cache first: an
          # architecture-specific build break fails the rehearsal long before a
          # release is ever prepared. This build exports nothing.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=cacheonly \
            --build-arg "ITAMBOX_VERSION=$ITAMBOX_VERSION" \
            --build-arg "ITAMBOX_REVISION=$GITHUB_SHA" \
            --build-arg "ITAMBOX_SOURCE=$ITAMBOX_SOURCE" \
            .
          # Load the host-platform image from that cache, so scanning, the
          # archive, and the SBOM keep operating on a local image as before.
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "ITAMBOX_VERSION=$ITAMBOX_VERSION" \
            --build-arg "ITAMBOX_REVISION=$GITHUB_SHA" \
            --build-arg "ITAMBOX_SOURCE=$ITAMBOX_SOURCE" \
            --tag itambox:release-rehearsal \
            .

      - name: Verify release image identity
        env:
          ITAMBOX_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          docker image inspect itambox:release-rehearsal > image-inspect.json
          python - <<'PY'
          import json
          import os

          labels = json.load(open("image-inspect.json", encoding="utf-8"))[0]["Config"]["Labels"]
          expected = {
              "org.opencontainers.image.version": os.environ["ITAMBOX_VERSION"],
              "org.opencontainers.image.revision": os.environ["GITHUB_SHA"],
              "org.opencontainers.image.source": os.environ["ITAMBOX_SOURCE"],
          }
          for name, value in expected.items():
              if labels.get(name) != value:
                  raise SystemExit(f"invalid image label {name}: {labels.get(name)!r} != {value!r}")
          print("Release image labels verified")
          PY

      - name: Scan rehearsed image before any release preparation
        shell: bash
        run: |
          set +x
          bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-tools" trivy
          if ! "$RUNNER_TEMP/security-tools/trivy" image --quiet --scanners vuln --ignore-unfixed \
            --format json --output "$RUNNER_TEMP/trivy-image.json" \
            itambox:release-rehearsal \
            >"$RUNNER_TEMP/trivy.stdout" 2>"$RUNNER_TEMP/trivy.stderr"; then
            echo "Image scanner failed; raw diagnostics are retained only on the runner" >&2
            exit 2
          fi

      - name: Apply release-image thresholds and suppressions
        id: image-gate
        shell: bash
        run: |
          set +x
          set +e
          python scripts/security_gate.py trivy \
            --report "$RUNNER_TEMP/trivy-image.json" \
            --sarif "$RUNNER_TEMP/trivy-image.sarif" \
            --fail-on any
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s "$RUNNER_TEMP/trivy-image.sarif" ]]; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain draft-image results in Code Scanning
        if: >-
          always() && steps.image-gate.outputs.sarif == 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image.sarif
          # Both image uploads in this workflow share one code scanning
          # configuration: the category that already exists on the default branch.
          # Code scanning compares tool+category, so a second category for the same
          # image makes it report "configuration not found" instead of comparing
          # alerts.
          category: trivy-draft-image

      - name: Enforce release-image gate
        if: always()
        env:
          GATE_STATUS: ${{ steps.image-gate.outputs.status }}
        run: |
          if [[ -z "$GATE_STATUS" || "$GATE_STATUS" != "0" ]]; then
            echo "Release-image security gate failed" >&2
            exit 1
          fi

      - name: Generate rehearsed image SBOM
        env:
          ITAMBOX_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set +x
          if ! "$RUNNER_TEMP/security-tools/trivy" image --quiet --format spdx-json \
            --output "itambox-${ITAMBOX_VERSION}.sbom.spdx.json" \
            itambox:release-rehearsal \
            >"$RUNNER_TEMP/trivy-sbom.stdout" 2>"$RUNNER_TEMP/trivy-sbom.stderr"; then
            echo "SBOM generation failed; raw diagnostics are retained only on the runner" >&2
            exit 2
          fi

      - name: Validate rehearsed image SBOM
        env:
          ITAMBOX_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          python scripts/release_sbom.py verify \
            --sbom "itambox-${ITAMBOX_VERSION}.sbom.spdx.json" \
            --image-inspect image-inspect.json \
            --image-ref itambox:release-rehearsal

  validate-dispatch-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject release preparation outside main
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Release preparation must be dispatched from main" >&2
            exit 1
          }

  e2e-qualification:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e.yml

  prepare-release:
    needs: [validate-dispatch-ref, e2e-qualification]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.e2e-qualification.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      security-events: write
      # Publishing the qualified image to the GitHub Container Registry.
      packages: write
      # Scoped to this job only: artifact attestations sign with the
      # workflow's OIDC identity and are stored in the repository store.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Validate requested version and reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_policy.py verify --version "$RELEASE_VERSION"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > associated-pulls.json
          python - <<'PY'
          import json
          import os

          pulls = json.load(open("associated-pulls.json", encoding="utf-8"))
          reviewed = any(
              pull.get("merged_at")
              and pull.get("merge_commit_sha") == os.environ["GITHUB_SHA"]
              and pull.get("base", {}).get("ref") == "main"
              for pull in pulls
          )
          if not reviewed:
              raise SystemExit("release commit is not the reviewed result of a PR merged into main")
          print("Reviewed main-branch release commit verified")
          PY

      - name: Log in to the GitHub Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set +x
          printf '%s' "$REGISTRY_TOKEN" | docker login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Build and push the reviewed release image by digest
        id: image-build
        shell: bash
        run: |
          set -euo pipefail
          # One build produces the multi-platform release image. It is pushed to
          # the registry by digest only — no tag exists yet — and the version
          # tag is created from this recorded digest after every gate passed.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output "type=image,name=${REGISTRY}/${IMAGE_NAME},push-by-digest=true,push=true" \
            --metadata-file itambox-build-metadata.json \
            --build-arg "ITAMBOX_VERSION=$RELEASE_VERSION" \
            --build-arg "ITAMBOX_REVISION=$GITHUB_SHA" \
            --build-arg "ITAMBOX_SOURCE=$ITAMBOX_SOURCE" \
            .
          index_digest="$(python - <<'PY'
          import json
          import re
          digest = json.load(open("itambox-build-metadata.json", encoding="utf-8"))["containerimage.digest"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"unexpected built image digest: {digest!r}")
          print(digest)
          PY
          )"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "INDEX_DIGEST=$index_digest" >> "$GITHUB_ENV"
          # Materialize the host-platform image from the digest that was just
          # pushed, so everything verified below is byte-identical to the
          # registry state of the release candidate.
          docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAME}@${index_digest}"
          docker tag "${REGISTRY}/${IMAGE_NAME}@${index_digest}" "itambox:${RELEASE_VERSION}"

      - name: Verify release image identity
        shell: bash
        run: |
          docker image inspect "itambox:${RELEASE_VERSION}" > image-inspect.json
          python - <<'PY'
          import json
          import os

          labels = json.load(open("image-inspect.json", encoding="utf-8"))[0]["Config"]["Labels"]
          expected = {
              "org.opencontainers.image.version": os.environ["RELEASE_VERSION"],
              "org.opencontainers.image.revision": os.environ["GITHUB_SHA"],
              "org.opencontainers.image.source": os.environ["ITAMBOX_SOURCE"],
          }
          for name, value in expected.items():
              if labels.get(name) != value:
                  raise SystemExit(f"invalid image label {name}: {labels.get(name)!r} != {value!r}")
          PY

      - name: Scan reviewed release image
        shell: bash
        run: |
          set +x
          bash scripts/install_security_tools.sh "$RUNNER_TEMP/security-tools" trivy
          if ! "$RUNNER_TEMP/security-tools/trivy" image --quiet --scanners vuln --ignore-unfixed \
            --format json --output "$RUNNER_TEMP/trivy-image.json" \
            "itambox:${RELEASE_VERSION}" \
            >"$RUNNER_TEMP/trivy.stdout" 2>"$RUNNER_TEMP/trivy.stderr"; then
            echo "Image scanner failed; raw diagnostics are retained only on the runner" >&2
            exit 2
          fi

      - name: Apply draft-image thresholds and suppressions
        id: draft-image-gate
        shell: bash
        run: |
          set +x
          set +e
          python scripts/security_gate.py trivy \
            --report "$RUNNER_TEMP/trivy-image.json" \
            --sarif "$RUNNER_TEMP/trivy-image.sarif" \
            --fail-on any
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s "$RUNNER_TEMP/trivy-image.sarif" ]]; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain draft-image results in Code Scanning
        if: always() && steps.draft-image-gate.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image.sarif
          # Same configuration as the rehearsal upload: code scanning compares the
          # pull request against the default branch per tool+category, and this
          # upload only keeps that single configuration up to date.
          category: trivy-draft-image

      - name: Enforce draft-image gate
        if: always()
        env:
          GATE_STATUS: ${{ steps.draft-image-gate.outputs.status }}
        run: |
          if [[ -z "$GATE_STATUS" || "$GATE_STATUS" != "0" ]]; then
            echo "Draft-image security gate failed" >&2
            exit 1
          fi

      - name: Archive reviewed release image
        shell: bash
        run: |
          docker save "itambox:${RELEASE_VERSION}" | gzip -9 > "itambox-${RELEASE_VERSION}.tar.gz"
          sha256sum "itambox-${RELEASE_VERSION}.tar.gz" > "itambox-${RELEASE_VERSION}.tar.gz.sha256"
          python scripts/release_policy.py notes \
            --version "$RELEASE_VERSION" > release-notes.md

      - name: Generate release image SBOM
        shell: bash
        run: |
          set +x
          if ! "$RUNNER_TEMP/security-tools/trivy" image --quiet --format spdx-json \
            --output "itambox-${RELEASE_VERSION}.sbom.spdx.json" \
            "itambox:${RELEASE_VERSION}" \
            >"$RUNNER_TEMP/trivy-sbom.stdout" 2>"$RUNNER_TEMP/trivy-sbom.stderr"; then
            echo "SBOM generation failed; raw diagnostics are retained only on the runner" >&2
            exit 2
          fi

      - name: Validate release image SBOM
        shell: bash
        run: |
          python scripts/release_sbom.py verify \
            --sbom "itambox-${RELEASE_VERSION}.sbom.spdx.json" \
            --image-inspect image-inspect.json \
            --image-ref "itambox:${RELEASE_VERSION}"

      - name: Promote the verified image digest to the release tag
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.image-build.outputs.index_digest }}
        run: |
          set -euo pipefail
          # Publishing the version tag is a registry-side promotion of the
          # digest the qualified build pushed: nothing is uploaded from the
          # local store again, and no other tag is ever created.
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}@${INDEX_DIGEST}"

      - name: Resolve and verify the published registry image identity
        id: ghcr-image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
          printf '%s\n' "$INDEX_DIGEST" > expected-index-digest.txt
          printf '%s@%s\n' "${REGISTRY}/${IMAGE_NAME}" "$INDEX_DIGEST" > repo-digests.txt
          docker buildx imagetools inspect --raw "$image_ref" > registry-manifest.json
          docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}' > registry-manifest-descriptor.json
          python scripts/check_registry_image.py verify-manifest \
            --manifest-raw registry-manifest.json \
            --descriptor registry-manifest-descriptor.json \
            --repo-digests repo-digests.txt \
            --expected-index-digest expected-index-digest.txt \
            --image "${REGISTRY}/${IMAGE_NAME}" > registry-identity.txt
          # The released tag must resolve to the multi-platform image index the
          # qualified build pushed; resolve each platform image manifest the
          # index lists by its digest and verify it.
          for platform in amd64 arm64; do
            upper="$(printf '%s' "$platform" | tr '[:lower:]' '[:upper:]')"
            image_manifest_digest="$(grep "^IMAGE_MANIFEST_DIGEST_${upper}=" registry-identity.txt | cut -d= -f2)"
            registry_image_manifest="registry-image-manifest-${platform}.json"
            docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${image_manifest_digest}" \
              > "$registry_image_manifest"
            image_config_digest="$(python scripts/check_registry_image.py verify-image \
              --manifest-raw "$registry_image_manifest" \
              --expected-digest "$image_manifest_digest" | cut -d= -f2)"
            printf 'IMAGE_CONFIG_DIGEST_%s=%s\n' "$upper" "$image_config_digest" >> image-config-digests.txt
          done
          cat registry-identity.txt image-config-digests.txt > ghcr-image-identity.txt
          cat ghcr-image-identity.txt >> "$GITHUB_OUTPUT"
          cat ghcr-image-identity.txt >> "$GITHUB_ENV"

      - name: Attest the published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.ghcr-image.outputs.GHCR_MANIFEST_DIGEST }}
          push-to-registry: true
          # Storage records require an organization-owned repository; the
          # itambox account is a user account, so records stay disabled.
          create-storage-record: false

      - name: Attest the published image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.ghcr-image.outputs.GHCR_MANIFEST_DIGEST }}
          sbom-path: itambox-${{ inputs.version }}.sbom.spdx.json
          push-to-registry: true
          # Storage records require an organization-owned repository; the
          # itambox account is a user account, so records stay disabled.
          create-storage-record: false

      - name: Verify the published image attestations
        shell: bash
        run: |
          set -euo pipefail
          image_ref="oci://${REGISTRY}/${IMAGE_NAME}@${GHCR_MANIFEST_DIGEST}"
          # actions/attest signs the SPDX 2.3 document with the versioned
          # predicate type; the registry bundle matches that annotation
          # exactly, so verify the exact signed value.
          for predicate in "https://slsa.dev/provenance/v1" "https://spdx.dev/Document/v2.3"; do
            for bundle_source in github registry; do
              flags=()
              if [[ "$bundle_source" == "registry" ]]; then
                flags+=(--bundle-from-oci)
              fi
              verified=false
              for attempt in 1 2 3; do
                if gh attestation verify "$image_ref" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                  --source-ref "refs/heads/main" \
                  --source-digest "$GITHUB_SHA" \
                  --predicate-type "$predicate" \
                  "${flags[@]}"; then
                  verified=true
                  break
                fi
                echo "Attestation (${predicate}, ${bundle_source}) not yet resolvable; retrying (${attempt}/3)" >&2
                sleep 10
              done
              test "$verified" = "true" || {
                echo "Attestation verification failed (${predicate}, source ${bundle_source})" >&2
                exit 1
              }
            done
          done

      - name: Boot-check both platform images
        shell: bash
        run: |
          set -euo pipefail
          # Run the application's own system check inside each published platform
          # image, so a release can only pass when both architectures boot. The
          # production settings require explicit secrets, so generate throwaway
          # values for this check; nothing is persisted.
          boot_secret_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          boot_db_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          for platform in amd64 arm64; do
            upper="$(printf '%s' "$platform" | tr '[:lower:]' '[:upper:]')"
            digest_var="IMAGE_MANIFEST_DIGEST_${upper}"
            digest="${!digest_var}"
            docker run --rm --platform "linux/${platform}" \
              -e "ITAMBOX_SECRET_KEY=$boot_secret_key" \
              -e "ITAMBOX_DB_PASSWORD=$boot_db_password" \
              "${REGISTRY}/${IMAGE_NAME}@${digest}" \
              python manage.py check
          done

      - name: Record the published image identity
        shell: bash
        run: |
          package_name="${IMAGE_NAME##*/}"
          {
            echo "### GitHub Container Registry"
            echo "- Published ${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION} (multi-platform index)"
            echo "- Resolved manifest form ${MODE}"
            echo "- Manifest digest ${GHCR_MANIFEST_DIGEST}"
            echo "- Platform manifest digests: linux/amd64 ${IMAGE_MANIFEST_DIGEST_AMD64}, linux/arm64 ${IMAGE_MANIFEST_DIGEST_ARM64}"
            echo "- Platform image config digests: linux/amd64 ${IMAGE_CONFIG_DIGEST_AMD64}, linux/arm64 ${IMAGE_CONFIG_DIGEST_ARM64}"
            echo "- First publish only: review the package visibility (GitHub package settings for ${package_name} → Package settings → Change visibility → Public); anonymous docker pull requires Public."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            itambox-${{ inputs.version }}.tar.gz
            itambox-${{ inputs.version }}.tar.gz.sha256
            itambox-${{ inputs.version }}.sbom.spdx.json

      - name: Verify release artifact attestation
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            "itambox-${RELEASE_VERSION}.tar.gz" \
            "itambox-${RELEASE_VERSION}.tar.gz.sha256" \
            "itambox-${RELEASE_VERSION}.sbom.spdx.json"; do
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$artifact" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                --source-ref "refs/heads/main" \
                --source-digest "$GITHUB_SHA"; then
                verified=true
                break
              fi
              echo "Attestation for $artifact not yet resolvable; retrying (${attempt}/3)" >&2
              sleep 10
            done
            test "$verified" = "true" || {
              echo "Attestation verification failed for $artifact" >&2
              exit 1
            }
          done

      - name: Retain reviewed image candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itambox-${{ inputs.version }}
          path: |
            itambox-${{ inputs.version }}.tar.gz
            itambox-${{ inputs.version }}.tar.gz.sha256
            itambox-${{ inputs.version }}.sbom.spdx.json
            itambox-build-metadata.json
            image-inspect.json
            registry-manifest.json
            registry-manifest-descriptor.json
            registry-image-manifest-amd64.json
            registry-image-manifest-arm64.json
            ghcr-image-identity.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          verify_release_tag() {
            local remote_ref target
            remote_ref="$(git ls-remote --exit-code --refs origin "refs/tags/${release_tag}")" || {
              echo "Unable to resolve the release tag from origin" >&2
              return 1
            }
            target="${remote_ref%%$'\t'*}"
            test "$target" = "$GITHUB_SHA" || {
              echo "Release tag does not resolve to the reviewed commit" >&2
              return 1
            }
          }
          git push --porcelain origin "$GITHUB_SHA:refs/tags/v${RELEASE_VERSION}"
          verify_release_tag
          flags=(
            --draft
            --verify-tag
            --target "$GITHUB_SHA"
            --title "ITAMbox v${RELEASE_VERSION}"
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$release_tag" "${flags[@]}" \
            "itambox-${RELEASE_VERSION}.tar.gz" \
            "itambox-${RELEASE_VERSION}.tar.gz.sha256" \
            "itambox-${RELEASE_VERSION}.sbom.spdx.json"
          verify_release_tag

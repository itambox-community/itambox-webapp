name: CI

on:
  push:
    branches: [master, main]
  # Every pull request runs the full suite, deliberately unfiltered: a change
  # that matches no path filter would leave this workflow's required checks
  # unreported, and a required check that never runs blocks the merge. A rule
  # whose inputs are listed in two places quietly stops running on the ones
  # somebody forgot to list; scope the work inside the jobs instead.
  pull_request:
  # Merge queue: every queue entry is tested as a synthetic merge commit, and
  # GitHub only reports checks that workflows run for the merge_group event.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Parallel and serial lanes run sequentially in this job; the previous
    # 60-minute budget cancelled the serial lane before the certification gates.
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: itambox_ci
          POSTGRES_USER: itambox_ci
          POSTGRES_PASSWORD: itambox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    env:
      ITAMBOX_ENV: dev
      ITAMBOX_DB_NAME: itambox_ci
      ITAMBOX_DB_USER: itambox_ci
      ITAMBOX_DB_PASSWORD: itambox_ci
      ITAMBOX_DB_HOST: localhost
      ITAMBOX_DB_PORT: "5432"
      ITAMBOX_DB_SSLMODE: disable

    steps:
      # Full history: the differential coverage gate diffs the change against the
      # merge base with the pull request's base commit, which a shallow clone
      # cannot resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Fail fast: a broken quality gate must be caught before the ~40 minute
      # suite runs, not after it. These suites are stdlib-only and need no
      # database or application environment, which is why they run on the bare
      # interpreter before any dependency is installed.
      #
      # Discovered, never enumerated. A hand-written module list is one a new
      # scripts/tests/test_*.py can be left out of, and a gate whose tests never
      # run is not a gate. scripts/tests/test_ci_workflow_policy.py holds this
      # step to discovery.
      - name: Check the repository gate suites
        run: |
          python -m unittest discover --start-directory scripts/tests --top-level-directory . --pattern 'test_*.py'

      - name: Check static migration audit
        run: |
          python scripts/migration_audit.py --check

      # python-ldap (pulled by django-auth-ldap) needs libldap2/sasl headers for
      # source builds. Bound every network operation so a slow hosted-runner
      # mirror cannot consume the whole job timeout; retry once against Ubuntu's
      # primary archive when the runner's Azure mirror is unavailable.
      - name: Install system deps for python-ldap
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              APT=(apt-get)
              EDIT=(sed)
            else
              APT=(sudo apt-get)
              EDIT=(sudo sed)
            fi
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            update_packages() {
              timeout --kill-after=10s 180s "${APT[@]}" "${apt_options[@]}" update
            }
            if ! update_packages; then
              echo "Azure Ubuntu mirror failed; retrying against archive.ubuntu.com." >&2
              mirror_replaced=false
              for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
                if [ -f "$source" ] && grep -Fq 'azure.archive.ubuntu.com/ubuntu' "$source"; then
                  "${EDIT[@]}" -i \
                    -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                    -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                    "$source"
                  mirror_replaced=true
                fi
              done
              if [ "$mirror_replaced" != true ]; then
                echo "APT update failed and no Azure Ubuntu mirror was configured." >&2
                exit 1
              fi
              update_packages
            fi
            timeout --kill-after=10s 300s "${APT[@]}" "${apt_options[@]}" install -y --no-install-recommends \
              gcc \
              libmagic1 \
              libldap2-dev \
              libsasl2-dev \
              libssl-dev \
              xmlsec1
          fi

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Verify native runtime bindings
        run: |
          uv run --locked --no-sync python -c "import ldap, magic; print(ldap.__version__); print(magic.from_buffer(b'ITAMbox'))"
          xmlsec1 --version

      # Cheap and early: the checked-module allowlist is small, and a module
      # that stopped type-checking clean should fail here rather than after the
      # migrations and the ~40 minute suite. It needs the full dev environment
      # installed above, because the django-stubs plugin imports the settings
      # module -- which is why this is the first step after the install and the
      # runtime-binding verification, not one of the bare-interpreter gates.
      - name: Check the static typing policy gate
        run: |
          uv run --locked --no-sync python scripts/check_typing_policy.py

      - name: Check deterministic OpenAPI schema and diagnostics baseline
        id: openapi
        env:
          PYTHONPATH: ""
          PYTHONHASHSEED: "0"
        run: |
          uv run --locked --no-sync python scripts/check_openapi_schema.py \
            --schema-output artifacts/openapi/schema.generated.yaml \
            --diagnostics-output artifacts/openapi/diagnostics.generated.json

      # The first run of a baseline bootstrap intentionally fails after writing
      # these files. Upload on both success and failure so reviewers can use the
      # canonical Linux output rather than committing a platform-local snapshot.
      - name: Upload OpenAPI generation artifacts
        if: always() && steps.openapi.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-generation-py${{ matrix.python-version }}
          path: artifacts/openapi/
          if-no-files-found: error
          retention-days: 30

      - name: Check for missing migrations
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py makemigrations --check --dry-run

      - name: Apply migrations to a fresh database
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py migrate --noinput

      - name: Verify migration baseline recognition
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py migration_baseline_preflight --format=json

      - name: Run Django system checks
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py check

      # The suite runs on two lanes. The parallel lane carries every test that
      # is safe under xdist (`-n auto --dist=loadscope -m 'not serial_only'`,
      # ~3480 tests); the serial-only lane runs the tests that require serial
      # semantics (races, migrations, global seed state, timing — the
      # `serial_only` marker, ~23 tests). The two lanes together are the
      # correctness source of truth, exactly matching the serial collection:
      # the manifest step below records that collection and the certification
      # gate enforces set equality against it, so a test dropped from both
      # lanes, or run in both, fails closed here.
      #
      # `addopts` is overridden rather than extended: the repository defaults
      # (`--reuse-db`, `--no-cov-on-fail`) are the wrong policy for the gate run.
      # A reused database is not a clean measurement, and suppressing the report
      # on failure would delete exactly the artifacts needed to diagnose it.
      #
      # `--cov-config` is mandatory, not decorative. coverage.py looks for its
      # configuration in the *current* directory, and pytest runs from itambox/,
      # so without this the root pyproject.toml is silently ignored: no branch
      # measurement, and migrations and test files counted as covered source.
      #
      # `--cov-fail-under=0` on both lanes: fail_under=70 from [tool.coverage]
      # applies per pytest invocation, but a lane is not the whole suite (the
      # serial-only lane alone measures ~37%). The whole-suite threshold is
      # enforced by the combined-ratchet gate below, which reads the union of
      # both lanes' measurements.
      - name: Collect the serial node IDs for the completeness manifest
        id: collect
        working-directory: ./itambox
        run: |
          mkdir -p ../artifacts
          # pytest --collect-only prints file-path node IDs
          # (itambox/assets/tests/test_api.py::Class::test) while the JUnit
          # reports carry module-dotted labels
          # (itambox.assets.tests.test_api.Class::test). Convert only the file
          # prefix (drop .py, slash to dot); the separator becomes a dot when a
          # class follows (NF >= 3) and stays "::" for module-level tests.
          uv run --locked --no-sync pytest --collect-only -q \
            -o addopts="--tb=short -p no:warnings" 2>/dev/null \
            | awk -F'::' 'NF >= 2 { sub(/\.py$/, "", $1); gsub(/\//, ".", $1); if (NF == 2) { line = $1 "::" $2 } else { line = $1 "." $2; for (i = 3; i <= NF; i++) line = line "::" $i } print line }' \
              > ../artifacts/node-ids.txt
          wc -l ../artifacts/node-ids.txt

      - name: Run the parallel lane
        id: parallel
        working-directory: ./itambox
        run: |
          set -Eeuo pipefail
          export COVERAGE_FILE=../artifacts/.coverage.parallel
          uv run --locked --no-sync pytest \
            -o addopts="--tb=short -p no:warnings" \
            --create-db \
            -n auto --dist=loadscope -m 'not serial_only' \
            --cov=. --cov-fail-under=0 \
            --cov-config=../pyproject.toml \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:../artifacts/coverage-parallel.json \
            --junitxml=../artifacts/junit-parallel.xml \
            --durations=25

      - name: Run the serial-only lane
        id: serial
        working-directory: ./itambox
        run: |
          set -Eeuo pipefail
          export COVERAGE_FILE=../artifacts/.coverage.serial
          uv run --locked --no-sync pytest \
            -o addopts="--tb=short -p no:warnings" \
            --create-db \
            -m serial_only \
            --cov=. --cov-fail-under=0 \
            --cov-config=../pyproject.toml \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:../artifacts/coverage-serial-only.json \
            --junitxml=../artifacts/junit-serial-only.xml \
            --durations=25

      # coverage.py resolves relative_files=true paths at report time against
      # the report command's CWD, so the JSON report (and only it) must be
      # generated from itambox/; the combine step's CWD is irrelevant.
      - name: Combine the lane coverage reports
        if: always() && steps.parallel.conclusion == 'success' && steps.serial.conclusion == 'success'
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync coverage combine \
            --rcfile=../pyproject.toml \
            --data-file=../artifacts/.coverage.combined \
            ../artifacts/.coverage.parallel \
            ../artifacts/.coverage.serial
          uv run --locked --no-sync coverage json \
            --rcfile=../pyproject.toml \
            --data-file=../artifacts/.coverage.combined \
            -o ../artifacts/coverage-combined.json

      # Published even when the lanes failed: the durations and partial coverage
      # of a failing run are the data you need to act on it. Not published when
      # the lanes were never attempted -- an earlier step failed, so there is no
      # report at all and `if-no-files-found: error` would report a missing
      # artifact as the failure instead of the one that actually happened.
      # The combined JSON is not uploaded: it is derived from the two lane
      # JSONs, and excluding it keeps this step correct even when a lane failed
      # and no combined report exists.
      - name: Upload coverage and duration artifacts
        if: always() && (steps.parallel.conclusion != 'skipped' || steps.serial.conclusion != 'skipped')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-durations-py${{ matrix.python-version }}
          path: |
            artifacts/junit-parallel.xml
            artifacts/junit-serial-only.xml
            artifacts/node-ids.txt
            artifacts/coverage-parallel.json
            artifacts/coverage-serial-only.json
            artifacts/.coverage.parallel
            artifacts/.coverage.serial
            artifacts/.coverage.combined
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 30

      # The four gates below are conditioned on both lanes having produced
      # reports, not on each other. They answer independent questions, so one
      # failing must not skip the next and hide its finding: a run that both
      # regressed globally and left new code untested has to report both.
      #
      # `always()` is what makes that true. A step with no `if:` -- or with a
      # condition that does not call a status function -- inherits `success()`,
      # so a failing gate (or a failing artifact upload) would silently skip
      # every step after it and the run would report one finding instead of
      # four. The explicit `steps.parallel`/`steps.serial` tests then supply
      # the real precondition: these gates read files the lanes write.
      #
      # Within a single CI run the matrix gate's parity check is vacuous (one
      # iteration); what it enforces here is disjointness of the two lanes.
      # Cross-run parity is the 20-iteration dispatch matrix's job
      # (xdist-validation.yml), not this gate's.
      - name: Check the lane matrix gate
        if: always() && steps.parallel.conclusion == 'success' && steps.serial.conclusion == 'success'
        run: |
          python scripts/check_xdist_matrix.py \
            --xdist artifacts/junit-parallel.xml \
            --serial artifacts/junit-serial-only.xml

      - name: Certify the run and publish durations
        if: always() && steps.parallel.conclusion == 'success' && steps.serial.conclusion == 'success'
        run: |
          python scripts/check_test_report.py \
            --report artifacts/junit-parallel.xml \
            --report artifacts/junit-serial-only.xml \
            --expected-node-ids artifacts/node-ids.txt \
            --summary-file "$GITHUB_STEP_SUMMARY"


  # Runs after the lane job AND the qualification job so both reports can be
  # produced without delaying either producer. The two coverage gates answer
  # different questions and therefore read different reports:
  #
  # * `coverage-lanes.json` is the stable ordinary population -- the parallel
  #   and serial lanes only. The global ratchet reads it, so whether the
  #   optional qualification ran on this change set never moves the recorded
  #   baseline.
  # * `coverage-combined.json` is the union of this same checkout, including
  #   the qualification coverage whenever the change set requires it. The
  #   differential gate reads it.
  coverage-gates:
    name: Coverage gates
    runs-on: ubuntu-latest
    needs: [test, migration-qualification]
    if: always()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system deps for python-ldap
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              APT=(apt-get)
            else
              APT=(sudo apt-get)
            fi
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            update_packages() {
              timeout --kill-after=10s 180s "${APT[@]}" "${apt_options[@]}" update
            }
            if ! update_packages; then
              echo "Azure Ubuntu mirror failed; retrying against archive.ubuntu.com." >&2
            fi
            "${APT[@]}" "${apt_options[@]}" install -y libldap2-dev libsasl2-dev
          fi

      - name: Install dependencies
        run: uv sync --locked --group dev

      # The ordinary report is rendered first, on purpose: `coverage combine`
      # consumes -- and removes -- the `.coverage.combined` data file it reads.
      - name: Download lane coverage
        if: needs.test.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-and-durations-py3.12
          path: artifacts

      - name: Render the ordinary lane report
        if: always() && needs.test.result == 'success'
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync coverage json \
            --rcfile=../pyproject.toml \
            --data-file=../artifacts/.coverage.combined \
            -o ../artifacts/coverage-lanes.json

      # Required means required: when the change set requires the qualification,
      # its coverage artifact must arrive intact. A missing, empty, or
      # unreadable file fails here instead of quietly degrading the differential
      # measurement to the ordinary lanes.
      - name: Download qualification coverage
        if: always() && needs.migration-qualification.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-coverage
          path: artifacts/qualification-coverage
          if-no-files-found: error

      - name: Verify the required qualification coverage
        if: always() && needs.migration-qualification.outputs.enabled == 'true'
        run: |
          if [ ! -s artifacts/qualification-coverage/.coverage.qualification ]; then
            echo "::error::the change set requires the migration/seed qualification, but its coverage artifact is missing or empty"
            exit 1
          fi

      - name: Combine lane and qualification coverage
        if: always() && needs.test.result == 'success'
        working-directory: ./itambox
        run: |
          if [ "${{ needs.migration-qualification.outputs.enabled }}" = "true" ]; then
            uv run --locked --no-sync coverage combine \
              --rcfile=../pyproject.toml \
              --data-file=../artifacts/.coverage.gates \
              ../artifacts/.coverage.combined ../artifacts/qualification-coverage/.coverage.qualification
            uv run --locked --no-sync coverage json \
              --rcfile=../pyproject.toml \
              --data-file=../artifacts/.coverage.gates \
              -o ../artifacts/coverage-combined.json
          else
            # Legitimately not required: the union of this checkout is the
            # ordinary lanes, already rendered above.
            cp ../artifacts/coverage-lanes.json ../artifacts/coverage-combined.json
          fi

      # The global ratchet holds the ordinary lanes against the reviewed
      # baseline. Qualification coverage is deliberately excluded here: its
      # presence depends on the change set, and a baseline that moved with it
      # would compare two different test populations from run to run.
      - name: Check the global coverage ratchet
        if: always() && needs.test.result == 'success' && hashFiles('artifacts/coverage-lanes.json') != ''
        run: |
          python scripts/check_coverage_baseline.py \
            --coverage-json artifacts/coverage-lanes.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # Pull requests only: on a push to a protected branch there is no
      # meaningful "changed code" range to hold to the differential target.
      # Reads the union of this checkout, so qualification coverage counts for
      # the changed lines it exercises.
      - name: Check differential coverage for changed production code
        if: always() && needs.test.result == 'success' && hashFiles('artifacts/coverage-combined.json') != '' && github.event_name == 'pull_request'
        run: |
          python scripts/check_diff_coverage.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD \
            --coverage-json artifacts/coverage-combined.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload the ordinary lane report
        if: always() && hashFiles('artifacts/coverage-lanes.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lanes-json
          path: artifacts/coverage-lanes.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the differential union report
        if: always() && hashFiles('artifacts/coverage-combined.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined-json
          path: artifacts/coverage-combined.json
          if-no-files-found: error
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ``--refresh-issue-states`` reads issue state through the GitHub API; the
    # workflow-level ``contents: read`` does not cover that scope.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: |
          uv lock --check
          uv sync --locked --only-group dev

      - name: Check configured Ruff lint rules
        run: |
          uv run --locked --no-sync ruff check itambox scripts

      - name: Check formatting (Ruff)
        run: |
          uv run --locked --no-sync ruff format --check itambox scripts

      - name: Check localization catalogs and product language
        run: |
          uv run --locked --no-sync python scripts/check_localization_catalog.py
          uv run --locked --no-sync python scripts/check_product_language.py

      - name: Lint with flake8 (blocking baseline gate)
        run: |
          uv run --locked --no-sync python scripts/check_flake8_baseline.py

      # The suite backing this gate runs by discovery in the `test` job above.
      - name: Check the local-import policy gate
        run: |
          uv run --locked --no-sync python scripts/check_local_imports.py

      # The suite backing this gate runs by discovery in the `test` job above.
      - name: Check the escape-hatch policy gate
        run: |
          uv run --locked --no-sync python scripts/check_escape_hatches.py

      - name: Check release image pinning policy
        run: |
          uv run --locked --no-sync python scripts/check_image_pins.py

      # Blocking over both graphs from the first run: a cycle or a cross-layer
      # edge that only exists once function-body imports are counted is still a
      # real runtime coupling. A model importing presentation is the one finding
      # with no baseline representation at any severity (see the private
      # itambox/design-docs repository's architecture policy).
      #
      # The suite backing this gate runs by discovery in the `test` job above.
      - name: Check the architecture boundary gate
        run: |
          uv run --locked --no-sync python scripts/check_architecture.py

      # The issue-state snapshot freezes which tracking issues the baseline may
      # reference. Refresh it from the API and fail when the refreshed document
      # differs: a closed or re-tracked issue stops CI until the snapshot is
      # re-reviewed and committed. The refresh is deterministic when nothing
      # changed, so this step does not rewrite the file on every run.
      - name: Refresh the architecture issue-state snapshot
        run: |
          uv run --locked --no-sync python scripts/check_architecture.py --refresh-issue-states
          git diff --exit-code -- scripts/architecture_issue_states.json
        env:
          GH_TOKEN: ${{ github.token }}

      # Two independent checks in one step: an identity ratchet over broad and
      # pass-only handlers, and a hard refusal of silent failures in crypto,
      # authentication, authorization, tenant resolution, configuration load,
      # and lexically transactional code. The second has no baseline; only the
      # explicitly permitted, logged boundary categories can satisfy it.
      #
      # Bare `except:` stays with flake8 E722 above, whose baseline records
      # none; this gate only cross-checks that the division still holds.
      #
      # The suite backing this gate runs by discovery in the `test` job above.
      - name: Check the exception policy gate
        run: |
          uv run --locked --no-sync python scripts/check_exception_policy.py

  template-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install template-lint dependencies
        run: |
          uv lock --check
          uv sync --locked --only-group dev

      - name: Lint authored Django templates
        run: |
          uv run --locked --no-sync python scripts/lint_templates.py --check --lint --statistics

  stylelint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: itambox/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./itambox
        run: npm ci

      - name: Lint authored CSS and SCSS
        working-directory: ./itambox
        run: npm run lint:styles

  inline-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install policy dependencies
        run: |
          uv lock --check
          uv sync --locked --only-group dev

      - name: Check CSP inline-style policy
        run: uv run --locked --no-sync python scripts/check_inline_styles.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: |
          uv lock --check
          uv sync --locked --only-group docs

      - name: Build docs (strict — fails on broken nav entries or unresolved links)
        working-directory: ./itambox
        run: uv run --locked --no-sync mkdocs build --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: itambox/package-lock.json

      - name: Install dependencies
        working-directory: ./itambox
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./itambox
        run: npm run test:unit

      - name: Build frontend assets
        working-directory: ./itambox
        run: npm run build:all

      - name: Type-check (tsc)
        working-directory: ./itambox
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: ./itambox
        run: npx eslint static/src

  # Historical migration rehearsals and the full demo-seed qualification were
  # moved out of the ordinary serial_only lane (scripts/qualification/). They
  # remain explicitly runnable and execute here only when migration files, the
  # seed implementation, or the qualification area itself change, plus on
  # workflow_dispatch (release qualification).
  migration-qualification:
    name: Migration & seed qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The relevance decision is published so the downstream coverage gates can
    # tell "this change set requires qualification coverage" from "this change
    # set legitimately does not", instead of inferring it from a possibly
    # missing artifact.
    outputs:
      enabled: ${{ steps.relevance.outputs.enabled }}
      reason: ${{ steps.relevance.outputs.reason }}
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: itambox_ci
          POSTGRES_USER: itambox_ci
          POSTGRES_PASSWORD: itambox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    env:
      ITAMBOX_ENV: dev
      ITAMBOX_DB_NAME: itambox_ci
      ITAMBOX_DB_USER: itambox_ci
      ITAMBOX_DB_PASSWORD: itambox_ci
      ITAMBOX_DB_HOST: localhost
      ITAMBOX_DB_PORT: "5432"
      ITAMBOX_DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine relevance
        id: relevance
        run: |
          # Always on for explicit dispatches (release qualification). On pull
          # requests the rehearsals run when the full change set touches
          # Django migrations, the seed implementation, the migration harness,
          # or the qualification area itself; their coverage then feeds the
          # combined differential measurement.
          #
          # When the qualification is required, its coverage is part of the
          # differential measurement, so this decision fails closed: an
          # unresolvable base or an uncomputable change set fails the job
          # instead of defaulting the change to "irrelevant".
          set -Eeuo pipefail
          emit() {
            echo "enabled=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            emit true "explicit dispatch: release qualification always runs"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit false "no changed-code range to qualify outside pull requests"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve the pull-request base $base; the relevance of the migration/seed qualification cannot be decided"
            exit 1
          fi
          if ! changed="$(git diff --name-only "$base...HEAD")"; then
            echo "::error::cannot compute the pull-request change set against $base"
            exit 1
          fi
          if printf '%s\n' "$changed" \
              | grep -Eq '^(itambox/.+migrations/|itambox/core/management/commands/_seed/|itambox/core/management/commands/seed_data.py|itambox/core/tests/migration_harness.py|scripts/qualification/)'; then
            emit true "the change set touches migrations, the seed implementation, the migration harness, or the qualification area"
          else
            emit false "the change set touches no qualification-relevant path"
          fi

      - name: Set up Python 3.12
        if: steps.relevance.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.relevance.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system deps for python-ldap
        if: steps.relevance.outputs.enabled == 'true'
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              APT=(apt-get)
            else
              APT=(sudo apt-get)
            fi
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            update_packages() {
              timeout --kill-after=10s 180s "${APT[@]}" "${apt_options[@]}" update
            }
            if ! update_packages; then
              echo "Azure Ubuntu mirror failed; retrying against archive.ubuntu.com." >&2
            fi
            "${APT[@]}" "${apt_options[@]}" install -y libldap2-dev libsasl2-dev
          fi

      - name: Install dependencies
        if: steps.relevance.outputs.enabled == 'true'
        run: uv sync --locked --group dev

      - name: Run migration rehearsals
        if: steps.relevance.outputs.enabled == 'true'
        working-directory: ./itambox
        run: |
          PYTHONPATH=. uv run --locked --no-sync python -m pytest ../scripts/qualification/migrations/ -q \
            --cov=. --cov-fail-under=0 --cov-config=../pyproject.toml \
            --cov-report=json:../artifacts/coverage-qualification.json
        env:
          COVERAGE_FILE: ../artifacts/.coverage.qualification

      - name: Run full demo-seed qualification
        if: steps.relevance.outputs.enabled == 'true'
        working-directory: ./itambox
        run: |
          PYTHONPATH=. uv run --locked --no-sync python -m pytest ../scripts/qualification/seed/ -q \
            --cov=. --cov-append --cov-fail-under=0 --cov-config=../pyproject.toml \
            --cov-report=json:../artifacts/coverage-qualification.json
        env:
          COVERAGE_FILE: ../artifacts/.coverage.qualification

      - name: Upload qualification coverage
        if: steps.relevance.outputs.enabled == 'true'
        run: |
          # The suites write COVERAGE_FILE relative to ./itambox (../artifacts),
          # which resolves to the repository root; move the real data file into
          # the workspace-relative directory the artifact upload expects.
          #
          # A required qualification that wrote no coverage data is an error:
          # publishing an empty placeholder would silently drop qualification
          # coverage from the differential measurement instead of failing closed.
          mkdir -p artifacts
          if [ ! -s ../artifacts/.coverage.qualification ]; then
            echo "::error::the change set requires the migration/seed qualification, but it wrote no coverage data"
            exit 1
          fi
          cp ../artifacts/.coverage.qualification artifacts/.coverage.qualification
        working-directory: ./itambox

      - name: Upload qualification coverage artifact
        if: steps.relevance.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-coverage
          path: itambox/artifacts/.coverage.qualification
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 30

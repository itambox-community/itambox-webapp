name: E2E (Playwright)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [main]
  # Merge queue entries are synthetic merges of main + queued PR(s); run the
  # full authoritative scope for them (selective optimisation can come later).
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-e2e-scope:
    name: E2E / Detect scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      selection_valid: ${{ steps.select.outputs.selection_valid }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      merge_base_sha: ${{ steps.select.outputs.merge_base_sha }}
      changed_path_digest: ${{ steps.select.outputs.changed_path_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate policy and select E2E scopes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          # scripts/tests/test_*.py is the complete early policy suite; discover
          # intentionally runs it before any application dependency setup.
          python -m unittest discover \
            --start-directory scripts/tests \
            --top-level-directory . \
            --pattern 'test_*.py'
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            # authoritative full events have no narrow PR range. The selector
            # still receives real, object-verified identities and emits full.
            BASE_SHA="$CHECKOUT_SHA"
            HEAD_SHA="$CHECKOUT_SHA"
          fi
          python scripts/select_e2e_scopes.py \
            --repo-root . \
            --scope-map scripts/e2e_scope_map.yaml \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output artifacts/e2e-selection.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload canonical selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-selection
          path: artifacts/e2e-selection.json
          if-no-files-found: error
          retention-days: 14

  e2e-selected:
    name: E2E / Selected or Full
    needs: detect-e2e-scope
    if: >-
      needs.detect-e2e-scope.result == 'success' &&
      (needs.detect-e2e-scope.outputs.mode == 'selected' || needs.detect-e2e-scope.outputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: itambox_e2e
          POSTGRES_USER: itambox_e2e
          POSTGRES_PASSWORD: itambox_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --host=127.0.0.1 --port=5432 --username=itambox_e2e --dbname=itambox_e2e"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.0@sha256:b9fa251aefee22a97c32534d23a1c400f01dbd483ab263b013d89f6d60d96691
        env:
          JSON_CONFIG: >-
            {"interactiveLogin":true,"httpServer":"NettyWrapper","tokenProvider":{"keyProvider":{"algorithm":"RS256"}},"tokenCallbacks":[{"issuerId":"itambox-e2e","tokenExpiry":300,"requestMappings":[{"requestParam":"subject","match":"itambox-e2e-oidc-user","claims":{"sub":"itambox-e2e-oidc-user","email":"e2e.oidc@itambox.local","given_name":"E2E","family_name":"OIDC","groups":["e2e-oidc-admins"],"aud":["${clientId}"],"azp":"${clientId}"}}]}]}
        ports:
          - 8081:8080

    env:
      DJANGO_SETTINGS_MODULE: core.settings.e2e
      ITAMBOX_ENV: dev
      ITAMBOX_DB_NAME: itambox_e2e
      ITAMBOX_DB_USER: itambox_e2e
      ITAMBOX_DB_PASSWORD: itambox_e2e
      ITAMBOX_DB_HOST: localhost
      ITAMBOX_DB_PORT: "5432"
      ITAMBOX_DB_SSLMODE: disable
      DJANGO_SUPERUSER_USERNAME: e2e-admin
      DJANGO_SUPERUSER_EMAIL: e2e@itambox.local
      E2E_USERNAME: e2e-admin
      # Aggregate-scope operator for the bulk basket journey (issue #424): a
      # seeded non-superuser with grants across the managed demo tenants. The
      # demo seed sets its password to ITAMBOX_SEED_PASSWORD (default in
      # settings: "itambox2026").
      E2E_AGGREGATE_USERNAME: lars.eklund
      E2E_AGGREGATE_PASSWORD: itambox2026
      # These principals are created in the disposable database below with
      # explicit tenant-local Asset Manager and Read-Only role grants.
      E2E_OPERATOR_USERNAME: e2e-operator
      E2E_VIEWER_USERNAME: e2e-viewer
      E2E_TENANT_SLUG: helix-rnd
      E2E_AGGREGATE_SECOND_TENANT_SLUG: helix-mfg
      E2E_ISOLATION_TENANT_SLUG: e2e-isolation-tenant
      E2E_TENANT_GROUP_NAME: E2E Tenant Read-Only Group
      E2E_BASE_URL: http://localhost:8000
      E2E_OIDC_PROVIDER_URL: http://127.0.0.1:8081
      E2E_OIDC_SUBJECT: itambox-e2e-oidc-user
      E2E_OIDC_EMAIL: e2e.oidc@itambox.local
      ITAMBOX_TENANT_OIDC_CONFIGS: >-
        {"helix-rnd":{"enabled":true,"display_name":"E2E OIDC","OIDC_RP_CLIENT_ID":"itambox-e2e-client","OIDC_RP_CLIENT_SECRET":"itambox-e2e-secret","OIDC_OP_AUTHORIZATION_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/authorize","OIDC_OP_TOKEN_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/token","OIDC_OP_USER_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/userinfo","OIDC_OP_ISSUER":"http://127.0.0.1:8081/itambox-e2e","OIDC_OP_JWKS_ENDPOINT":"http://127.0.0.1:8081/itambox-e2e/jwks","OIDC_RP_SIGN_ALGO":"RS256","OIDC_RP_SCOPES":"openid email profile groups","OIDC_USE_NONCE":true,"OIDC_CREATE_USER":true,"OIDC_GROUP_ROLE_MAPPING":{"e2e-oidc-admins":"Admin"}}}
      # Playwright's webServer config uses a venv path; in CI we manage the server
      # ourselves for reliability and to avoid venv path assumptions.
      E2E_NO_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # python-ldap (pulled by django-auth-ldap) needs libldap2/sasl headers for
      # source builds. Bound every network operation so a slow hosted-runner
      # mirror cannot consume the whole job timeout; retry once against Ubuntu's
      # primary archive when the runner's Azure mirror is unavailable.
      - name: Install system deps for python-ldap
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              APT=(apt-get)
              EDIT=(sed)
            else
              APT=(sudo apt-get)
              EDIT=(sudo sed)
            fi
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            update_packages() {
              timeout --kill-after=10s 180s "${APT[@]}" "${apt_options[@]}" update
            }
            if ! update_packages; then
              echo "Azure Ubuntu mirror failed; retrying against archive.ubuntu.com." >&2
              mirror_replaced=false
              for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
                if [ -f "$source" ] && grep -Fq 'azure.archive.ubuntu.com/ubuntu' "$source"; then
                  "${EDIT[@]}" -i \
                    -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                    -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                    "$source"
                  mirror_replaced=true
                fi
              done
              if [ "$mirror_replaced" != true ]; then
                echo "APT update failed and no Azure Ubuntu mirror was configured." >&2
                exit 1
              fi
              update_packages
            fi
            timeout --kill-after=10s 300s "${APT[@]}" "${apt_options[@]}" install -y --no-install-recommends \
              gcc \
              libmagic1 \
              libldap2-dev \
              libsasl2-dev \
              libssl-dev \
              xmlsec1
          fi

      - name: Install Python dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: itambox/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./itambox
        run: npm ci

      - name: Build frontend assets
        working-directory: ./itambox
        run: npm run build:all

      - name: Install E2E dependencies
        working-directory: ./itambox/tests/e2e
        run: npm ci

      - name: Configure ephemeral Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        working-directory: ./itambox/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Check OIDC mock provider readiness
        env:
          E2E_OIDC_PROVIDER_URL: ${{ env.E2E_OIDC_PROVIDER_URL }}
        run: |
          set -Eeuo pipefail
          provider_url="$E2E_OIDC_PROVIDER_URL"
          alive_url="${provider_url}/isalive"
          discovery_url="${provider_url}/itambox-e2e/.well-known/openid-configuration"
          jwks_url="${provider_url}/itambox-e2e/jwks"
          discovery_path="${RUNNER_TEMP}/oidc-discovery.json"
          jwks_path="${RUNNER_TEMP}/oidc-jwks.json"
          deadline=$((SECONDS + 60))
          attempt=0
          live=false

          while (( SECONDS < deadline && attempt < 60 )); do
            attempt=$((attempt + 1))
            if curl --fail --silent --show-error --max-time 5 "$alive_url" >/dev/null 2>/dev/null; then
              live=true
              break
            fi
            sleep 1
          done
          if [[ "$live" != true ]]; then
            echo "OIDC mock provider did not become live within the bounded readiness window."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 10 "$discovery_url" > "$discovery_path"
          curl --fail --silent --show-error --max-time 10 "$jwks_url" > "$jwks_path"
          E2E_OIDC_PROVIDER_URL="$provider_url" DISCOVERY_PATH="$discovery_path" JWKS_PATH="$jwks_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          provider_url = os.environ["E2E_OIDC_PROVIDER_URL"]
          expected = {
              "issuer": f"{provider_url}/itambox-e2e",
              "authorization_endpoint": f"{provider_url}/itambox-e2e/authorize",
              "token_endpoint": f"{provider_url}/itambox-e2e/token",
              "userinfo_endpoint": f"{provider_url}/itambox-e2e/userinfo",
              "jwks_uri": f"{provider_url}/itambox-e2e/jwks",
          }
          discovery = json.loads(Path(os.environ["DISCOVERY_PATH"]).read_text(encoding="utf-8"))
          for key, value in expected.items():
              if discovery.get(key) != value:
                  raise SystemExit(f"OIDC discovery contract mismatch for {key}")

          jwks = json.loads(Path(os.environ["JWKS_PATH"]).read_text(encoding="utf-8"))
          if not any(
              key.get("kty") == "RSA"
              and key.get("use", "sig") == "sig"
              and key.get("alg", "RS256") == "RS256"
              for key in jwks.get("keys", [])
          ):
              raise SystemExit("OIDC JWKS has no RSA signing key usable for RS256")

          for key, value in expected.items():
              print(f"OIDC {key}: {value}")
          print("OIDC mock provider readiness passed; JWKS contains an RSA signing key usable for RS256.")
          PY

      - name: Run Django system checks
        working-directory: ./itambox
        run: uv run --locked --no-sync python manage.py check

      - name: Run migrations
        working-directory: ./itambox
        run: uv run --locked --no-sync python manage.py migrate

      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "DJANGO_SUPERUSER_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"

      - name: Seed full E2E fixture data
        working-directory: ./itambox
        run: |
          # The existing browser suite exercises real assets, tenants, GraphQL,
          # HTMX, and SCIM flows, so the minimal production bootstrap is not enough.
          # This database is a disposable, job-local PostgreSQL service.
          uv run --locked --no-sync python manage.py seed_data --force

      - name: Provision E2E principal and SCIM token
        working-directory: ./itambox
        run: |
          uv run --locked --no-sync python manage.py shell <<'PY'
          import os
          from datetime import timedelta

          from django.contrib.auth import get_user_model
          from django.contrib.contenttypes.models import ContentType
          from django.db.models import Q
          from django.utils import timezone
          from assets.models import Asset, AssetType, AssetTypeFieldset, StatusLabel
          from extras.models import CustomField, CustomFieldset, CustomFieldsetField
          from organization.models import AssetHolder, Membership, Role, RoleGrant, RoleGrantScope, Tenant
          from users.models import Token, UserGroup

          User = get_user_model()
          oidc_email = os.environ["E2E_OIDC_EMAIL"]
          user, _ = User.objects.get_or_create(
              username=os.environ["E2E_USERNAME"],
              defaults={"email": os.environ["DJANGO_SUPERUSER_EMAIL"]},
          )
          user.email = os.environ["DJANGO_SUPERUSER_EMAIL"]
          user.is_active = True
          user.is_staff = True
          user.is_superuser = True
          user.set_password(os.environ["E2E_PASSWORD"])
          user.save()

          tenant = Tenant._base_manager.get(
              slug=os.environ["E2E_TENANT_SLUG"],
              is_provider=False,
              deleted_at__isnull=True,
          )
          aggregate_second_tenant = Tenant._base_manager.get(
              slug=os.environ["E2E_AGGREGATE_SECOND_TENANT_SLUG"],
              is_provider=False,
              deleted_at__isnull=True,
          )
          if aggregate_second_tenant.pk == tenant.pk:
              raise RuntimeError("Aggregate E2E setup tenants must be distinct")
          isolation_tenant, _ = Tenant._base_manager.get_or_create(
              slug=os.environ["E2E_ISOLATION_TENANT_SLUG"],
              defaults={"name": "E2E Isolation Tenant", "is_provider": False},
          )
          if isolation_tenant.is_provider or isolation_tenant.deleted_at is not None:
              raise RuntimeError("E2E isolation fixture tenant must be a live non-provider tenant")

          administrator_roles = Role.all_objects.filter(
              tenant=tenant,
              name="Administrator",
              deleted_at__isnull=True,
          )
          if administrator_roles.count() != 1:
              raise RuntimeError("E2E tenant must have exactly one live Administrator role")
          administrator = administrator_roles.get()
          admin_roles = Role.all_objects.filter(
              tenant=tenant,
              name="Admin",
              deleted_at__isnull=True,
          )
          if admin_roles.count() > 1:
              raise RuntimeError("E2E tenant must have at most one live Admin role")
          admin = admin_roles.first()
          if admin is None:
              Role.all_objects.create(
                  tenant=tenant,
                  name="Admin",
                  description="E2E OIDC mapped role.",
                  permissions=list(administrator.permissions or []),
              )
          else:
              admin.permissions = list(administrator.permissions or [])
              admin.save(update_fields=["permissions"])

          if User._base_manager.filter(email=oidc_email).exists():
              raise RuntimeError("E2E OIDC fixture User already exists")
          holder_match = AssetHolder.all_objects.filter(tenant=tenant).filter(
              Q(email=oidc_email) | Q(upn=oidc_email) | Q(user__email=oidc_email) | Q(user__username=oidc_email)
          )
          if holder_match.exists():
              raise RuntimeError("E2E OIDC fixture AssetHolder already exists")
          membership_match = Membership._base_manager.filter(tenant=tenant).filter(
              Q(user__email=oidc_email) | Q(user__username=oidc_email)
          )
          if membership_match.exists():
              raise RuntimeError("E2E OIDC fixture Membership already exists")
          print("E2E OIDC fixture absence and Admin-role preconditions passed.")

          def provision_tenant_role(principal, role_name):
              membership, _ = Membership._base_manager.get_or_create(user=principal, tenant=tenant)
              membership.is_active = True
              membership.save(update_fields=["is_active"])
              role = Role.all_objects.get(tenant=tenant, name=role_name, deleted_at__isnull=True)
              grant, _ = RoleGrant._base_manager.get_or_create(
                  membership=membership,
                  role=role,
                  defaults={
                      "granted_by": user,
                      "reason": "Disposable CI E2E role boundary.",
                      "valid_until": timezone.now() + timedelta(hours=4),
                  },
              )
              RoleGrantScope._base_manager.get_or_create(
                  role_grant=grant,
                  scope_type=RoleGrantScope.SCOPE_OWN,
                  tenant=None,
                  tenant_group=None,
              )

          def provision_role_principal(username, email, first_name, last_name, role_name):
              principal, _ = User._base_manager.get_or_create(
                  username=username,
                  defaults={
                      "email": email,
                      "first_name": first_name,
                      "last_name": last_name,
                      "is_staff": False,
                      "is_superuser": False,
                  },
              )
              principal.email = email
              principal.is_active = True
              principal.is_staff = False
              principal.is_superuser = False
              principal.set_password(os.environ["E2E_PASSWORD"])
              principal.save()
              holder, _ = AssetHolder.all_objects.get_or_create(
                  tenant=tenant,
                  upn=username,
                  defaults={
                      "first_name": first_name,
                      "last_name": last_name,
                      "email": email,
                      "user": principal,
                  },
              )
              if holder.user_id not in (None, principal.pk):
                  raise RuntimeError(f"E2E holder {username} is owned by another principal")
              if holder.user_id is None:
                  holder.user = principal
                  holder.save(update_fields=["user"])
              provision_tenant_role(principal, role_name)
              return principal

          provision_tenant_role(user, "Administrator")
          print("E2E admin role boundary provisioned with tenant-local grant.")

          provision_role_principal(
              os.environ["E2E_OPERATOR_USERNAME"],
              "e2e-operator@itambox.local",
              "E2E",
              "Operator",
              "Asset Manager",
          )
          provision_role_principal(
              os.environ["E2E_VIEWER_USERNAME"],
              "e2e-viewer@itambox.local",
              "E2E",
              "Viewer",
              "Read-Only",
          )
          print("E2E operator/viewer role boundary provisioned with tenant-local grants.")

          asset_content_type = ContentType.objects.get_for_model(Asset)
          required_field, _ = CustomField.objects.update_or_create(
              name="e2e_required_boolean",
              defaults={
                  "namespace": "e2e",
                  "label": "E2E required boolean",
                  "help_text": "",
                  "field_type": CustomField.FIELD_TYPE_BOOLEAN,
                  "activation": CustomField.ACTIVATION_COMPOSED,
                  "management_kind": CustomField.MANAGEMENT_LOCAL,
                  "lifecycle": CustomField.LIFECYCLE_ACTIVE,
                  "required": True,
                  "nullable": False,
              },
          )
          required_field.object_types.set([asset_content_type])
          required_fieldset, _ = CustomFieldset.objects.update_or_create(
              namespace="e2e",
              slug="required-asset-fields",
              defaults={
                  "label": "E2E required asset fields",
                  "description": "Disposable required-field coverage for browser qualification.",
                  "management_kind": CustomFieldset.MANAGEMENT_LOCAL,
                  "lifecycle": CustomFieldset.LIFECYCLE_ACTIVE,
              },
          )
          CustomFieldsetField.objects.update_or_create(
              fieldset=required_fieldset,
              custom_field=required_field,
              defaults={"position": 1},
          )
          type_a = AssetType._base_manager.get(slug="dell-latitude-5550")
          AssetTypeFieldset.objects.update_or_create(
              asset_type=type_a,
              fieldset=required_fieldset,
              defaults={"position": 1000},
          )
          status = StatusLabel._base_manager.order_by("pk").first()
          type_b = AssetType._base_manager.get(slug="cisco-catalyst-9300")
          if status is None:
              raise RuntimeError("E2E fixture requires at least one asset status")
          foreign_asset, _ = Asset._base_manager.get_or_create(
              asset_tag="E2E-ISOLATION-ASSET",
              defaults={
                  "name": "E2E isolation foreign asset",
                  "asset_type": type_b,
                  "status": status,
                  "tenant": isolation_tenant,
              },
          )
          if foreign_asset.tenant_id != isolation_tenant.pk:
              raise RuntimeError("E2E isolation asset must belong to the isolation tenant")
          print("E2E required Boolean composition and foreign-tenant asset fixtures provisioned.")

          UserGroup._base_manager.get_or_create(
              tenant=tenant,
              name=os.environ["E2E_TENANT_GROUP_NAME"],
          )
          Token.objects.filter(user=user, description="GitHub Actions E2E SCIM").delete()
          token = Token.objects.create(
              user=user,
              tenant=tenant,
              write_enabled=True,
              description="GitHub Actions E2E SCIM",
          )
          Token.objects.filter(user=user, description="GitHub Actions E2E aggregate setup").delete()
          # The aggregate second-tenant write context uses the same principal,
          # so provision the tenant-B membership and Administrator grant before
          # issuing the tenant-B token. The specification-write path resolves
          # explicit tenant authorization and a tenant-bound token alone does
          # not grant it (issue #438 qualification boundary).
          aggregate_admin = Role.all_objects.get(
              tenant=aggregate_second_tenant,
              name="Administrator",
              deleted_at__isnull=True,
          )
          aggregate_membership, _ = Membership._base_manager.get_or_create(
              user=user,
              tenant=aggregate_second_tenant,
          )
          aggregate_membership.is_active = True
          aggregate_membership.save(update_fields=["is_active"])
          aggregate_grant, _ = RoleGrant._base_manager.get_or_create(
              membership=aggregate_membership,
              role=aggregate_admin,
              defaults={
                  "granted_by": user,
                  "reason": "Disposable CI E2E aggregate second-tenant boundary.",
                  "valid_until": timezone.now() + timedelta(hours=4),
              },
          )
          RoleGrantScope._base_manager.get_or_create(
              role_grant=aggregate_grant,
              scope_type=RoleGrantScope.SCOPE_OWN,
              tenant=None,
              tenant_group=None,
          )
          secondary_token = Token.objects.create(
              user=user,
              tenant=aggregate_second_tenant,
              write_enabled=True,
              description="GitHub Actions E2E aggregate setup",
          )
          plaintext = token.key
          secondary_plaintext = secondary_token.key
          print(f"::add-mask::{plaintext}")
          print(f"::add-mask::{secondary_plaintext}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"E2E_SCIM_TOKEN={plaintext}\n")
              env_file.write(f"E2E_API_TOKEN={plaintext}\n")
              env_file.write(f"E2E_API_TOKEN_SECONDARY={secondary_plaintext}\n")
              env_file.write(f"E2E_TENANT_ID={tenant.pk}\n")
              env_file.write(f"E2E_ISOLATION_TENANT_ID={isolation_tenant.pk}\n")
              env_file.write(f"E2E_ISOLATION_ASSET_ID={foreign_asset.pk}\n")
          PY

      - name: Start Django dev server
        working-directory: ./itambox
        run: |
          echo "Starting Django dev server on loopback port 8000..."
          # The redacted wrapper below executes: uv run --locked --no-sync python manage.py runserver 127.0.0.1:8000
          uv run --locked --no-sync python - <<'PY' &
          import os
          import re
          import runpy
          import sys

          import django
          from django.conf import settings
          from django.core.servers import basehttp

          original_log_message = basehttp.WSGIRequestHandler.log_message

          def redacted_log_message(self, format, *args):
              safe_args = tuple(
                  re.sub(r'([^\s"]+)\?[^\s"]*', r'\1', value) if isinstance(value, str) else value
                  for value in args
              )
              return original_log_message(self, format, *safe_args)

          basehttp.WSGIRequestHandler.log_message = redacted_log_message
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings.dev")
          # The dev-only debug toolbar (v7) reads #djDebug without a null guard
          # in its AJAX handler (toolbar.js updateOnAjax), raising pageerror
          # events that the Playwright specs treat as failures. Disable it
          # before setup so the toolbar's config cache picks up the override.
          settings.DEBUG_TOOLBAR_CONFIG = {
              "SHOW_TOOLBAR_CALLBACK": lambda request: False,
          }
          django.setup()
          settings.RATELIMIT_USE_X_FORWARDED_FOR = True
          settings.RATELIMIT_NUM_PROXIES = 1
          sys.argv = ["manage.py", "runserver", "127.0.0.1:8000", "--noreload"]
          runpy.run_path("manage.py", run_name="__main__")
          PY
          DJANGO_PID=$!
          echo "DJANGO_PID=$DJANGO_PID" >> "$GITHUB_ENV"
          django_ready=false
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200\|301\|302"; then
              django_ready=true
              break
            fi
            sleep 1
          done
          [[ ${django_ready} == true ]]
          echo "Django server ready."

      - name: Download validated E2E selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-selection
          path: artifacts/selection

      - name: Record tested checkout identity
        working-directory: ./
        env:
          E2E_EVENT_NAME: ${{ github.event_name }}
          E2E_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from scripts.select_e2e_scopes import SelectionError, build_e2e_identity

          selection_path = Path("artifacts/selection/e2e-selection.json")
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          checkout = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          event_name = os.environ["E2E_EVENT_NAME"]
          if event_name == "pull_request":
              base_sha = os.environ["E2E_PR_BASE_SHA"]
              head_sha = os.environ["E2E_PR_HEAD_SHA"]
              synthetic_merge_sha = os.environ["E2E_WORKFLOW_SHA"]
          else:
              base_sha = checkout
              head_sha = checkout
              synthetic_merge_sha = None
          try:
              identity = build_e2e_identity(
                  ".",
                  event_name=event_name,
                  base_sha=base_sha,
                  head_sha=head_sha,
                  checkout_sha=checkout,
                  synthetic_merge_sha=synthetic_merge_sha,
              )
          except SelectionError as exc:
              raise SystemExit(f"E2E provenance derivation failed: {exc}") from exc
          for key in ("event_name", "base_sha", "head_sha", "merge_base_sha", "changed_path_digest"):
              if selection.get(key) != identity[key]:
                  raise SystemExit(
                      f"E2E provenance mismatch for {key}: "
                      f"selection={selection.get(key)!r}, derived={identity[key]!r}"
                  )
          output = Path("artifacts/e2e-current-identity.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(identity, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(
              f"E2E provenance recorded: event={event_name}, base={base_sha}, head={head_sha}, "
              f"merge_base={identity['merge_base_sha']}, checkout={checkout}, kind=head."
          )
          PY

      - name: Run selected/full Playwright qualification
        id: e2e
        working-directory: ./itambox/tests/e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/artifacts/e2e-playwright.json
        run: |
          node run-selected.mjs \
            --selection "$GITHUB_WORKSPACE/artifacts/selection/e2e-selection.json" \
            --discovery "$GITHUB_WORKSPACE/artifacts/e2e-discovery.json" \
            --report "$GITHUB_WORKSPACE/artifacts/e2e-playwright.json" \
            --execution "$GITHUB_WORKSPACE/artifacts/e2e-execution.json"
        timeout-minutes: 30

      - name: Run E2E producer unit tests
        working-directory: ./itambox/tests/e2e
        run: node --test run-selected.test.mjs
        timeout-minutes: 5

      - name: Certify Playwright discovery and execution
        if: always()
        working-directory: ./
        run: |
          python scripts/certify_e2e_run.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --scope-map scripts/e2e_scope_map.yaml \
            --selection artifacts/selection/e2e-selection.json \
            --discovery artifacts/e2e-discovery.json \
            --execution artifacts/e2e-execution.json \
            --current-identity artifacts/e2e-current-identity.json \
            --output artifacts/e2e-certification.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E machine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-run-evidence
          path: |
            artifacts/selection/e2e-selection.json
            artifacts/e2e-current-identity.json
            artifacts/e2e-discovery.json
            artifacts/e2e-execution.json
            artifacts/e2e-playwright.json
            artifacts/e2e-certification.json
          if-no-files-found: error
          retention-days: 14

      - name: Run generated OpenAPI client smoke test
        if: always()
        working-directory: ./itambox
        run: npm run openapi-client-smoke && git diff --exit-code -- tests/openapi_client/schema.d.ts
        timeout-minutes: 5

      - name: Stop Django dev server
        if: always()
        working-directory: ./itambox
        run: |
          if [ -n "$DJANGO_PID" ]; then
            kill "$DJANGO_PID" 2>/dev/null || true
          fi
          # Fallback: kill any remaining runserver processes
          pkill -f "manage.py runserver" 2>/dev/null || true

      - name: Upload Playwright traces on failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: |
            itambox/tests/e2e/test-results/
            itambox/tests/e2e/playwright-report/
            itambox/tests/e2e/storageStateError.png
            artifacts/
          if-no-files-found: warn
          retention-days: 7

  e2e-gate:
    name: E2E / Gate
    if: always()
    needs: [detect-e2e-scope, e2e-selected]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download detector evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-selection
          path: artifacts/selection
      - name: Download execution evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-run-evidence
          path: artifacts/run
      - name: Build aggregate gate input
        env:
          DETECTOR_RESULT: ${{ needs.detect-e2e-scope.result }}
          EXECUTION_RESULT: ${{ needs.e2e-selected.result }}
          # detector_result/execution_result are consumed by the stdlib gate envelope.
          EVENT_NAME: ${{ github.event_name }}
          E2E_EVENT_NAME: ${{ github.event_name }}
          E2E_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def load(path):
              return json.loads(path.read_text(encoding="utf-8")) if path.is_file() else None

          selection = load(Path("artifacts/selection/e2e-selection.json"))
          execution = load(Path("artifacts/run/e2e-execution.json"))
          certification = load(Path("artifacts/run/e2e-certification.json"))
          current_identity = load(Path("artifacts/run/e2e-current-identity.json"))
          if selection is not None:
              from scripts.select_e2e_scopes import SelectionError, build_e2e_identity

              checkout = subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              event_name = os.environ["E2E_EVENT_NAME"]
              if event_name == "pull_request":
                  base_sha = os.environ["E2E_PR_BASE_SHA"]
                  head_sha = os.environ["E2E_PR_HEAD_SHA"]
                  synthetic_merge_sha = os.environ["E2E_WORKFLOW_SHA"]
              else:
                  base_sha = checkout
                  head_sha = checkout
                  synthetic_merge_sha = None
              try:
                  expected_identity = build_e2e_identity(
                      ".",
                      event_name=event_name,
                      base_sha=base_sha,
                      head_sha=head_sha,
                      checkout_sha=checkout,
                      synthetic_merge_sha=synthetic_merge_sha,
                  )
              except SelectionError as exc:
                  raise SystemExit(f"E2E gate provenance derivation failed: {exc}") from exc
              for key in sorted(set(selection) & set(expected_identity)):
                  if selection.get(key) != expected_identity.get(key):
                      raise SystemExit(
                          f"E2E gate provenance mismatch for {key}: "
                          f"selection={selection.get(key)!r}, derived={expected_identity.get(key)!r}"
                      )
              if current_identity is not None:
                  if not isinstance(current_identity, dict):
                      raise SystemExit("E2E gate provenance is not an object")
                  for key in sorted(set(current_identity) | set(expected_identity)):
                      if current_identity.get(key) != expected_identity.get(key):
                          raise SystemExit(
                              f"E2E gate provenance mismatch for {key}: "
                              f"recorded={current_identity.get(key)!r}, derived={expected_identity.get(key)!r}"
                          )
              if selection["mode"] != "none" and current_identity is None:
                  raise SystemExit("E2E gate provenance is missing for selected/full execution")
              current = (
                  {key: expected_identity[key] for key in ("event_name", "base_sha", "head_sha", "merge_base_sha", "changed_path_digest")}
                  if selection["mode"] == "none"
                  else current_identity
              )
          else:
              current = {}
          detector = {
              "result": os.environ["DETECTOR_RESULT"],
              "selection": selection,
              "artifact_exists": Path("artifacts/selection/e2e-selection.json").is_file(),
          }
          if os.environ["EXECUTION_RESULT"] == "success" and execution is not None and selection is not None:
              execution_input = {
                  "result": "success",
                  "selection": execution.get("selection"),
                  "tested_checkout_sha": execution.get("tested_checkout_sha", ""),
                  "selection_artifact_exists": True,
                  "discovery_artifact_exists": Path("artifacts/run/e2e-discovery.json").is_file(),
                  "report_artifact_exists": Path("artifacts/run/e2e-playwright.json").is_file(),
                  "certification_artifact_exists": Path("artifacts/run/e2e-certification.json").is_file(),
              }
          else:
              execution_input = {"result": os.environ["EXECUTION_RESULT"]}
          gate_input = {
              "schema": 1,
              "detector": detector,
              "execution": execution_input,
              "certification": certification,
              "current": current,
          }
          output = Path("artifacts/e2e-gate-input.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(gate_input, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Evaluate stable aggregate gate
        run: |
          python scripts/check_e2e_gate.py \
            --input artifacts/e2e-gate-input.json \
            --output artifacts/e2e-gate.json \
            --summary "$GITHUB_STEP_SUMMARY"

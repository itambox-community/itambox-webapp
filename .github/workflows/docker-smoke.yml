name: Docker Compose Smoke Test

on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - "docker-compose.yml"
      - "Dockerfile"
      - "scripts/docker-smoke-test.sh"
      - "scripts/tests/test_docker_smoke_helpers.sh"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell syntax
        run: |
          bash -n scripts/docker-smoke-test.sh
          bash -n scripts/tests/test_docker_smoke_helpers.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install helper dependencies
        run: |
          uv lock --check
          uv sync --locked --only-group dev

      - name: Validate workflow/compose YAML syntax
        run: |
          uv run --locked --no-sync python - <<'PYEOF'
          import yaml
          for path in (".github/workflows/docker-smoke.yml", "docker-compose.yml"):
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"{path}: valid YAML")
          PYEOF

      - name: Run secret-generation helper unit tests
        run: scripts/tests/test_docker_smoke_helpers.sh

  smoke:
    needs: helpers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker / Compose versions
        run: |
          docker version
          docker compose version

      - name: Run production Docker Compose smoke test
        id: smoke
        run: ./scripts/docker-smoke-test.sh

      - name: Upload smoke test diagnostics
        if: failure() && steps.smoke.outputs.log-dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-logs
          path: ${{ steps.smoke.outputs.log-dir }}
          if-no-files-found: warn
          retention-days: 7

# ==============================================================================
# ITAMbox — production stack.
# ==============================================================================
# Secrets and host configuration come from a .env file you provide next to this
# file (see .env.example). At minimum set, for production:
#   ITAMBOX_SECRET_KEY            (long random value)
#   ITAMBOX_ALLOWED_HOSTS         (your domain(s); keep 127.0.0.1 for the probe)
#   ITAMBOX_DB_PASSWORD
#   ITAMBOX_CSRF_TRUSTED_ORIGINS  (https://your-domain)
#   ITAMBOX_EMAIL_*               (real SMTP for password resets / alerts)
#
# TLS is expected to be terminated by a reverse proxy / ingress in front of this
# stack; the app trusts X-Forwarded-Proto via SECURE_PROXY_SSL_HEADER.
#
# First run (database is not migrated automatically on container start):
#   docker compose build
#   docker compose run --rm app python manage.py migrate
#   docker compose run --rm app python manage.py createsuperuser
#   docker compose up -d
#
# Local development uses the bare-metal flow in CLAUDE.md (runserver), or run
# with ITAMBOX_ENV=dev.
# ==============================================================================

x-app-env: &app-env
  ITAMBOX_ENV: prod
  ITAMBOX_DEBUG: "False"
  ITAMBOX_DB_HOST: db
  ITAMBOX_DB_PORT: "5432"
  # The bundled `db` is stock postgres:16 with no TLS, and app<->db traffic stays on the
  # internal docker network — so disable the libpq sslmode=require default (which would make
  # a from-scratch `docker compose up` fail to connect). External/managed Postgres should set
  # ITAMBOX_DB_SSLMODE=require (or verify-full) via the environment instead.
  ITAMBOX_DB_SSLMODE: disable
  ITAMBOX_CACHE_BACKEND: redis
  # Valkey (BSD-licensed Redis fork) speaks the Redis wire protocol, so the
  # redis:// URL and django-redis client are unchanged — only the server differs.
  ITAMBOX_REDIS_URL: redis://valkey:6379/1
  RATELIMIT_CACHE: default

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; req=u.Request('http://127.0.0.1:8000/health/', headers={'Host':'127.0.0.1','X-Forwarded-Proto':'https'}); sys.exit(0 if u.urlopen(req, timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    command: python manage.py qcluster
    env_file: .env
    environment: *app-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  db:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ITAMBOX_DB_USER:-itambox}
      # Fail closed: a source-built production stack must never start with a
      # source-known credential. An unset/empty password aborts `compose
      # config`/`compose up` before any container starts. "Explicitly
      # configured" is the contract - the literal value is not banned.
      POSTGRES_PASSWORD: ${ITAMBOX_DB_PASSWORD:?set ITAMBOX_DB_PASSWORD in .env}
      POSTGRES_DB: ${ITAMBOX_DB_NAME:-itambox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITAMBOX_DB_USER:-itambox} -d ${ITAMBOX_DB_NAME:-itambox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey — the Linux Foundation's BSD-3 fork of Redis (Redis relicensed to
  # SSPL/RSALv2 in 2024). Drop-in: same wire protocol, same django-redis client.
  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:

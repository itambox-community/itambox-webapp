[project]
name = "itambox"
version = "1.0.0-beta.3"
description = "IT Asset Management System inspired by NetBox"
requires-python = ">=3.12"
# NOTE: ITAMbox is NOT pip-installable and does not ship wheels/sdists. The apps
# are top-level packages (core, organization, assets, ...) rooted in itambox/ —
# packaging them would install a package literally named `core` into
# site-packages. The supported deployment paths are Docker (see Dockerfile /
# docker-compose.yml) and a checkout synchronized from uv.lock. This table is
# the only source of direct runtime dependency policy; uv.lock records the exact
# cross-platform resolution used by Docker, CI, and contributors.
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "drf-spectacular[sidecar]>=0.29,<0.31",
    "django-tables2>=3.0.0,<3.1",
    "django-filter>=25.2,<26.2",
    "django-htmx>=1.29.0,<1.30",
    "django-template-partials>=25.3,<25.4",
    "django-crispy-forms>=2.6,<2.7",
    "crispy-bootstrap5>=2026.3,<2027",
    "django-taggit>=6.1,<6.2",
    "django-q2>=1.7,<2.0",
    "sqlparse>=0.6.0,<0.7.0",
    "croniter>=6.0,<7.0",
    "python-dateutil>=2.9,<3.0",
    "strawberry-graphql>=0.328,<0.329",
    "strawberry-graphql-django>=0.92,<0.93",
    "django-otp>=1.4,<1.8",
    # Excluded on native Windows: pulls python-ldap, which has no Windows binary
    # wheel and fails to build there. Docker/Linux/WSL images are unaffected.
    "django-auth-ldap>=5.1,<6.0; platform_system != \"Windows\"",
    "djangosaml2>=1.12.0,<2.0",
    "mozilla-django-oidc>=5.0.2,<6.0.0",
    "pyOpenSSL>=24.3,<27",
    "cryptography>=50.0.0,<51.0",
    "django-cors-headers>=4.9.0,<5.0",
    "requests>=2.31,<3.0",
    "gunicorn>=26.0.0,<27.0",
    "whitenoise>=6.6,<7.0",
    "psycopg2-binary>=2.9.12,<3.0",
    "django-redis>=7.0.0,<8.0",
    "redis>=8.1.0,<9.0",
    "Pillow>=12.3.0,<13.0",
    # Excluded on native Windows because importing without a usable libmagic DLL
    # can hang. Docker/Linux/WSL retain full MIME signature validation.
    "python-magic>=0.4.27,<0.5; platform_system != \"Windows\"",
    "segno>=1.6,<2.0",
    "python-barcode>=0.15,<1.0",
    "markdown>=3.10,<3.11",
    "Jinja2>=3.1,<4.0",
    "html5lib>=1.1,<2.0",
    "tinycss2>=1.5,<2.0",
    "xhtml2pdf>=0.2.17,<0.3",
    # Security floor for xhtml2pdf's PDF engine, also imported by PDF integration tests.
    "pypdf>=6.16.1,<7.0",
    "svglib>=2.0.2,<2.1",
    "openpyxl>=3.1,<3.2",
    "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.13.0,<5.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-xdist>=3.5,<4.0",
    "model-bakery>=1.17,<2.0",
    "factory_boy>=3.3,<4.0",
    "tblib>=3.0,<4.0",
    "django-debug-toolbar>=7.0.0,<8.0",
    # Exact versions: scripts/flake8_baseline.json is diagnostic-version-bound.
    "flake8==7.3.0",
    "flake8-bugbear==24.12.12",
    "mccabe==0.7.0",
    "pycodestyle==2.14.0",
    "pyflakes==3.4.0",
    "pre-commit>=4.0,<5.0",
    "djlint==1.43.2",
    "PyYAML>=6.0,<7.0",
    # Exact version: formatting/import-sort output must be reproducible across
    # contributors, pre-commit, and CI (see pyproject.toml [tool.ruff]).
    "ruff==0.15.20",
    # Backend static typing (issue #93). Exact versions on purpose: what "clean"
    # means for a checked module is decided by the checker and its stubs, so the
    # triple below is part of the typing policy fingerprint recorded in
    # scripts/typing_checked_modules.json. The `compatible-mypy` extras keep the
    # stubs and the checker resolvable as one set rather than three independent
    # pins that drift apart. See the private design-docs typing-policy.md.
    "mypy==2.3.0",
    "django-stubs[compatible-mypy]==6.0.7",
    "djangorestframework-stubs[compatible-mypy]==3.17.1",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.5",
]

[tool.uv]
package = false
required-version = "==0.11.31"

# No [build-system] / setuptools packaging on purpose: uv synchronizes the
# declared dependencies but never installs the checkout as a package.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py"]
# Fast by default: serial runs reuse the test DB across runs (stable name set in
# conftest); xdist runs receive a process-specific base name so concurrent runs
# cannot collide. Coverage is NOT measured by default (it
# ~3x's a run); pass `--cov=. --cov-report=html` explicitly, or run the CI job.
#
# pytest-xdist is enabled for the parallel lane: run the full suite as
# `-n auto -m 'not serial_only'` (CI does exactly this). Tests that race,
# mutate global/seed state, exercise migrations, or are timing-sensitive must
# carry the `serial_only` marker so they stay on the serial lane. Plain
# `-n auto` over the whole suite remains banned.
addopts = ["--tb=short", "-p", "no:warnings", "--reuse-db", "--no-cov-on-fail"]
markers = ["serial_only: test requires an isolated serial lane (races, migrations, or global seed state)"]
# An expected failure that starts passing is a failure: the journey suite (itambox/tests/journeys)
# parks open defects behind xfail and the fixing change must delete the marker.
xfail_strict = true
norecursedirs = [".venv", "scratch", "node_modules", ".git", ".agents", ".*"]

[tool.coverage.run]
# Branch coverage is measured, not just line coverage: a partially-taken `if`
# is the shape most tenancy/permission regressions hide in, and line coverage
# alone reports such a branch as fully covered. Both rates are recorded and
# ratcheted by scripts/check_coverage_baseline.py.
branch = true
source = ["."]
# Store measured paths relative to the run directory (itambox/). Absolute paths
# are machine- and OS-specific, which would make coverage.json unusable for the
# differential gate and incomparable between a contributor's run and CI's.
relative_files = true
# Exclusion policy: generated code, test code, and process entry points only --
# never hand-written application code. Every entry below must stay justifiable
# on its own; this list is the reviewable record of what is NOT measured.
omit = [
    # Generated by `makemigrations`, never hand-written (see CLAUDE.md).
    "*/migrations/*",
    # Test code measures the application, not itself.
    "*/tests/*",
    "*/tests.py",
    "*/conftest.py",
    # Process entry points: exercised by deployment/smoke jobs, not unit tests.
    "manage.py",
    "core/wsgi.py",
    "core/asgi.py",
    "itambox/wsgi.py",
    "itambox/asgi.py",
]

[tool.coverage.report]
# Coarse floor only -- NOT the ratchet. The authoritative, reviewed gate is the
# identity baseline in scripts/coverage_baseline.json enforced by
# scripts/check_coverage_baseline.py, which holds both line and branch rates to
# the recorded values. This number exists so an ad-hoc local `pytest --cov` run
# still fails loudly on a catastrophic drop; the gate refuses to run if this
# floor is ever raised above the measured combined rate, since a floor above
# what the suite achieves fails every run and therefore enforces nothing.
#
# coverage.py compares this against the COMBINED line+branch percentage. The old
# value of 45 was calibrated against a measurement that never applied this file
# (see --cov-config in the Makefile): it counted generated migrations and test
# modules as covered source and reported ~86%, so the floor was unreachable in
# principle and unenforced in practice.
fail_under = 70
show_missing = true
# Line-level exclusions: unreachable-by-design or import-time-only boilerplate.
# Keep this list short and specific -- each pattern hides real lines from the
# ratchet, so anything with behaviour belongs in a test instead.
exclude_also = [
    # Import-time-only block; contains no runtime behaviour.
    "if TYPE_CHECKING:",
    # Abstract contract markers -- the subclass implementations are measured.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # Script entry points; the callable body above them is measured.
    "if __name__ == .__main__.:",
]

[tool.coverage.json]
# The differential gate needs per-file line/branch detail, not just totals.
show_contexts = false

[tool.ruff]
# Canonical formatter, import sorter, and lint gate (see issue #87 / #622).
# Ruff owns formatting/import order, 132-character E501, and migrated semantic
# rules. Flake8 retains the not-yet-migrated rules as a blocking bridge.
line-length = 120
target-version = "py312"
# Two independent import roots: itambox/ (Django project root -- apps import
# each other by bare name, e.g. `from organization.models import Tenant`) and
# the repo root (scripts/ is imported as a top-level package, e.g.
# `from scripts.release_policy import ...`).
src = ["itambox", "."]
# Generated/dependency/vendor paths only -- never hand-written app code.
# .git, __pycache__, .venv, venv, node_modules, and dist are already covered
# by Ruff's built-in default excludes.
extend-exclude = [
    "*/migrations/*",
    "itambox/static/dist",
    "itambox/static/docs",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# Ruff owns import ordering, E501, phase-2 B007/B009/B010/B028/B905/F541,
# phase-3 E741, phase-4 E402, and phase-5 F403/F405. The Flake8 bridge retains
# the rules not yet migrated in setup.cfg.
select = ["B007", "B009", "B010", "B028", "B905", "E402", "E501", "E741", "F401", "F403", "F405", "F541", "I"]

[tool.ruff.lint.pycodestyle]
# B950's 10% grace over Flake8 max-line-length=120 was exactly 132 characters.
max-line-length = 132

# Backend static typing policy (issue #93). The flags below are written out one
# by one rather than abbreviated to `strict = true`: `strict` is an alias whose
# membership changes between mypy releases, so an upgrade could silently change
# what "clean" means for every checked module. This exact table is fingerprinted
# into scripts/typing_checked_modules.json, and scripts/check_typing_policy.py
# refuses to run when the recorded policy and this section disagree.
#
# The checked set is the allowlist in scripts/typing_checked_modules.json and
# nothing else -- deliberately no `files` key here, so the gate stays the single
# authority on which modules must be clean.
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
# Unchecked modules are read for their types but never reported. That is what
# makes a bounded allowlist possible without a repository-wide clean-up first.
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
disallow_any_generics = true
disallow_any_unimported = true
# DRF, graphene, and django-q decorators are untyped. Requiring them to be typed
# would make third-party release timing decide whether this repository builds; a
# decorated function still has to carry its own annotations, which
# disallow_untyped_defs already enforces.
disallow_untyped_decorators = false
# `disallow_untyped_calls` is deliberately NOT in this first ratchet: with the
# current annotation coverage it would pull the entire first-party callee
# closure of every checked module into scope. It is a named later ratchet step,
# taken once the checked set has enough typed callees (see
# the private design-docs typing-policy.md).
#
# `redundant-expr` is deliberately NOT enabled. Its judgement is made against
# mypy's inferred type, which for a parser reading untrusted JSON is narrower
# than what actually arrives at runtime: it reports the isinstance guards in the
# SCIM PATCH parser as always-false and would push a contributor to delete
# defensive validation of external input to make the gate green. `ignore-without-code`
# and `possibly-undefined` have no such failure mode.
enable_error_code = ["ignore-without-code", "possibly-undefined"]

# The django-stubs mypy plugin needs a settings module to resolve model, manager,
# and `settings.*` types. `core.settings.dev` is the checked-in development
# configuration; it performs no database, network, or filesystem-mutating work at
# import time, and the gate runs it with ITAMBOX_ENV=dev rather than inheriting a
# developer environment.
[tool.django-stubs]
django_settings_module = "core.settings.dev"

# Template lint policy (issue #94). The profile stays fail-closed for authored
# template syntax, structure, and formatting. H005/H016/H030 cover the
# accessibility/SEO scope owned by #101; H021 covers inline-style/CSP debt owned
# by #24. These are explicit scope boundaries, not a debt baseline.
[tool.djlint]
profile = "django"
use_gitignore = true
ignore = "H005,H016,H021,H030"
# django-template-partials uses the non-conventional startpartial/endpartial
# pair. The formatter understands the opening shape; T038 is ignored only in
# the exact 13 files using that third-party pair (see per-file-ignores below).
custom_blocks = "{% startpartial %}...{% endpartial %}"

[tool.djlint.per-file-ignores]
"itambox/compliance/templates/compliance/audits/audit_session_flag_missing.html" = "T038"
"itambox/inventory/templates/inventory/includes/accessory_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/component_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/consumable_checkout_modal.html" = "T038"
"itambox/inventory/templates/inventory/includes/kit_checkout_modal.html" = "T038"
"itambox/templates/assets/includes/asset_audit_modal.html" = "T038"
"itambox/templates/assets/includes/asset_checkin_modal.html" = "T038"
"itambox/templates/assets/includes/asset_checkout_modal.html" = "T038"
"itambox/templates/generic/includes/add_stock_modal.html" = "T038"
"itambox/templates/licenses/includes/license_checkout_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_cancel_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_checkout_modal.html" = "T038"
"itambox/templates/subscriptions/includes/subscription_renew_modal.html" = "T038"

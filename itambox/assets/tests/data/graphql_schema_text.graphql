type SubscriptionNode {
  """The commercial vendor of this subscription."""
  supplier: SupplierNode!
  type: SubscriptionsSubscriptionTypeChoices!
  status: SubscriptionsSubscriptionStatusChoices!

  """ISO 4217 code. Leave blank to use the tenant default currency."""
  currency: SubscriptionsSubscriptionCurrencyChoices
  billingCycle: SubscriptionsSubscriptionBillingCycleChoices
  tenant: TenantNode
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  """Descriptive name (e.g., Adobe Creative Cloud - All Apps (Team))"""
  name: String!

  """URL-friendly identifier (auto-generated from name if left blank)"""
  slug: String
  startDate: Date
  renewalDate: Date

  """Cost per renewal period"""
  renewalCost: Decimal

  """Duration of the subscription term in months"""
  termMonths: Int

  """
  Records whether the vendor's contract renews automatically. ITAMbox does not renew subscriptions: a subscription past its renewal date is marked expired.
  """
  vendorContractAutoRenews: Boolean!

  """
  Number of seats, users, or devices entitled by the vendor agreement. This value is independent of linked License seats.
  """
  licensedQuantity: Int

  """Contract number, PO reference, or quote ID"""
  contractReference: String!
  cancellationDate: Date

  """Optional text detailing coverage or terms"""
  description: String!

  """Optional internal notes"""
  notes: String!
  costCenterId: ID
  costCenterName: String
  autoRenewal: Boolean @deprecated(reason: "Use vendorContractAutoRenews; autoRenewal is removed in 2.0.")
}

"""An enumeration."""
enum SubscriptionsSubscriptionBillingCycleChoices {
  """Monthly"""
  MONTHLY

  """Quarterly"""
  QUARTERLY

  """Annual"""
  ANNUAL

  """Biannual"""
  BIANNUAL

  """Multi-Year"""
  MULTI_YEAR

  """One-Time"""
  ONETIME
}

"""An enumeration."""
enum SubscriptionsSubscriptionCurrencyChoices {
  """Euro (€)"""
  EUR

  """US Dollar ($)"""
  USD

  """British Pound (£)"""
  GBP

  """Swiss Franc (CHF)"""
  CHF

  """Swedish Krona (kr)"""
  SEK

  """Norwegian Krone (kr)"""
  NOK

  """Danish Krone (kr)"""
  DKK

  """Canadian Dollar (CA$)"""
  CAD

  """Australian Dollar (A$)"""
  AUD

  """Japanese Yen (¥)"""
  JPY
}

"""An enumeration."""
enum SubscriptionsSubscriptionStatusChoices {
  """Active"""
  ACTIVE

  """Suspended"""
  SUSPENDED

  """Cancelled"""
  CANCELLED

  """Expired"""
  EXPIRED
}


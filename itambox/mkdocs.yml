# mkdocs.yml (ITAMbox Root)
site_name: ITAMbox End-User Documentation
# The docs are served beneath the application at a deployment-specific URL. Do not
# set a fixed local site_url here; the build must not publish a .local canonical.
site_dir: static/docs  # Outputs compiled files directly into Django's static folder
use_directory_urls: false

# Raised above the MkDocs 1.6 defaults (info) so `mkdocs build --strict` fails on
# them: a new page missing from the nav is unreachable in the built site, and a
# stale anchor is a dead link that renders as a working one.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn


theme:
  name: material  # Mirror of NetBox's gorgeous Material for MkDocs theme
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true


[flake8]
max-line-length = 120
max-complexity = 10
# Generated/dependency/vendor paths only -- never hand-written app code.
exclude =
    .git,
    __pycache__,
    *migrations*,
    .venv,
    venv,
    node_modules,
    dist,
    itambox/static/dist,
    itambox/static/docs
select = B,C,E,F,W,B9
# Blocking policy: this is the gate CI and pre-commit enforce (see
# scripts/check_flake8_baseline.py for how pre-existing debt is grandfathered
# without exempting new violations). Each ignore below is deliberate, not a
# blanket relaxation:
#   E203 (whitespace before ':')   -- pycodestyle's slice-colon spacing rule
#       flags PEP 8-compliant slicing (e.g. `x[1 :2]` false positives on
#       normal `x[a : b]` usage); pyflakes/pycodestyle acknowledge this is
#       overly strict and it is conventionally disabled.
#   E501 (line too long)           -- enforced by Ruff E501 at 132 characters;
#       this matches the 10% grace cutoff B950 had over Flake8's 120-character
#       limit. The Flake8 copy is ignored to avoid duplicate enforcement.
#   B950 (line too long)           -- explicitly retired in favor of Ruff E501
#       after exact file/line parity was measured and all 24 findings were fixed.
#   B907/B908 (Bugbear)             -- remain Flake8-only because Ruff 0.15.20
#       exposes no equivalent selectors; other unmigrated rules remain ratcheted.
#   B007/B009/B010/B028/B905 and F541 -- migrated to Ruff in phase 2 after
#       exact file/line parity was measured and all 28 findings were fixed.
#   E741 -- migrated to Ruff in phase 3; same-tree comparison showed Ruff was
#       stricter (8 findings vs Flake8's 7), and all 8 findings were fixed.
#   E402 -- migrated to Ruff in phase 4; same-tree comparison showed Ruff was
#       stricter (102 findings vs Flake8's 84), and all 102 findings were fixed.
#   F403/F405 -- migrated to Ruff in phase 5; intentional settings exports use
#       exact import-line F403/F401 exceptions because Django requires the namespace.
#   F401 -- migrated to Ruff in the final phase of #622 after six paydown waves
#       brought the tree to 0 findings and same-tree comparison showed 0 vs 0.
#   W503 (line break before binary operator) -- PEP 8 itself now prefers
#       breaking *before* the operator; W503 and its complement W504 (break
#       *after*, left enabled) are mutually exclusive style opinions, and
#       this repo's policy is "break before".
ignore = E203, E501, W503, B950, B007, B009, B010, B028, B905, E741, E402, F401, F403, F405, F541
format = default
